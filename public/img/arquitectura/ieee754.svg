<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title"><title id="title">Campos de una palabra binary32</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#2d729e"/></marker></defs><rect width="960" height="390" rx="16" fill="#f4f8fc"/><g font-family="Arial, sans-serif"><text x="480" y="40" font-size="25" fill="#12314c" text-anchor="middle">Campos de una palabra binary32</text><rect x="60" y="110" width="100" height="90" rx="10" fill="#f8dec9" stroke="#315c7c" stroke-width="2"/><text x="110.0" y="162.0" font-size="20" fill="#12314c" text-anchor="middle">s</text><rect x="160" y="110" width="240" height="90" rx="10" fill="#d2e8ff" stroke="#315c7c" stroke-width="2"/><text x="280.0" y="162.0" font-size="20" fill="#12314c" text-anchor="middle">E: 8 bits</text><rect x="400" y="110" width="500" height="90" rx="10" fill="#d9efdf" stroke="#315c7c" stroke-width="2"/><text x="650.0" y="162.0" font-size="20" fill="#12314c" text-anchor="middle">F: 23 bits</text><text x="110" y="235" font-size="20" fill="#12314c" text-anchor="middle">Signo</text><text x="280" y="235" font-size="20" fill="#12314c" text-anchor="middle">Exponente sesgado</text><text x="650" y="235" font-size="20" fill="#12314c" text-anchor="middle">Fracción del significando</text><text x="480" y="305" font-size="25" fill="#12314c" text-anchor="middle">Normal: (−1)ˢ · (1 + F/2²³) · 2ᴱ⁻¹²⁷</text><text x="480" y="345" font-size="18" fill="#12314c" text-anchor="middle">Solo para 1 ≤ E ≤ 254; cero, subnormales y especiales usan otras reglas.</text></g></svg>