<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title"><title id="title">Marco de pila de 16 bits</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#2d729e"/></marker></defs><rect width="960" height="410" rx="16" fill="#f4f8fc"/><g font-family="Arial, sans-serif"><text x="480" y="40" font-size="25" fill="#12314c" text-anchor="middle">Marco de pila de 16 bits</text><rect x="285" y="85" width="440" height="55" rx="10" fill="#e1e9f1" stroke="#315c7c" stroke-width="2"/><text x="505.0" y="119.5" font-size="20" fill="#12314c" text-anchor="middle">BP + 0: BP anterior</text><rect x="285" y="147" width="440" height="55" rx="10" fill="#f8dec9" stroke="#315c7c" stroke-width="2"/><text x="505.0" y="181.5" font-size="20" fill="#12314c" text-anchor="middle">BP + 2: IP de retorno</text><rect x="285" y="209" width="440" height="55" rx="10" fill="#d9efdf" stroke="#315c7c" stroke-width="2"/><text x="505.0" y="243.5" font-size="20" fill="#12314c" text-anchor="middle">BP + 4: último parámetro</text><rect x="285" y="271" width="440" height="55" rx="10" fill="#d9efdf" stroke="#315c7c" stroke-width="2"/><text x="505.0" y="305.5" font-size="20" fill="#12314c" text-anchor="middle">BP + 6: parámetro anterior</text><text x="145" y="100" font-size="21" fill="#12314c" text-anchor="middle">BP y SP</text><path d="M200 115 L280 115" stroke="#2d729e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="160" y="320" font-size="19" fill="#12314c" text-anchor="middle">PUSH baja SP</text><path d="M210 280 L210 175" stroke="#2d729e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="500" y="375" font-size="18" fill="#12314c" text-anchor="middle">Llamada cercana; parámetros word; prólogo PUSH BP / MOV BP, SP.</text></g></svg>