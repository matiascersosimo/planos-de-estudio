<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title"><title id="title">Dirección física del 8086</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#2d729e"/></marker></defs><rect width="960" height="390" rx="16" fill="#f4f8fc"/><g font-family="Arial, sans-serif"><text x="480" y="40" font-size="25" fill="#12314c" text-anchor="middle">Dirección física del 8086</text><rect x="70" y="100" width="250" height="70" rx="10" fill="#dcedfa" stroke="#315c7c" stroke-width="2"/><text x="195.0" y="142.0" font-size="20" fill="#12314c" text-anchor="middle">Segmento = 1234h</text><rect x="400" y="100" width="200" height="70" rx="10" fill="#dcedfa" stroke="#315c7c" stroke-width="2"/><text x="500.0" y="142.0" font-size="20" fill="#12314c" text-anchor="middle">Offset = 0020h</text><path d="M195 180 L195 235" stroke="#2d729e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="70" y="240" width="250" height="70" rx="10" fill="#dcedfa" stroke="#315c7c" stroke-width="2"/><text x="195.0" y="282.0" font-size="20" fill="#12314c" text-anchor="middle">Base = 12340h</text><text x="360" y="287" font-size="32" fill="#12314c" text-anchor="middle">+</text><rect x="400" y="240" width="200" height="70" rx="10" fill="#dcedfa" stroke="#315c7c" stroke-width="2"/><text x="500.0" y="282.0" font-size="20" fill="#12314c" text-anchor="middle">0020h</text><text x="650" y="287" font-size="32" fill="#12314c" text-anchor="middle">=</text><rect x="700" y="240" width="210" height="70" rx="10" fill="#d9efdf" stroke="#315c7c" stroke-width="2"/><text x="805.0" y="282.0" font-size="20" fill="#12314c" text-anchor="middle">12360h</text><text x="480" y="350" font-size="19" fill="#12314c" text-anchor="middle">Base = segmento × 16. Hay distintos pares que llegan al mismo byte.</text></g></svg>