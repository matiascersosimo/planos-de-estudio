<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title"><title id="title">DMA: separar control y transferencia de datos</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#2d729e"/></marker></defs><rect width="960" height="410" rx="16" fill="#f4f8fc"/><g font-family="Arial, sans-serif"><text x="480" y="40" font-size="25" fill="#12314c" text-anchor="middle">DMA: separar control y transferencia de datos</text><rect x="60" y="100" width="180" height="90" rx="10" fill="#dcedfa" stroke="#315c7c" stroke-width="2"/><text x="150.0" y="152.0" font-size="20" fill="#12314c" text-anchor="middle">CPU</text><rect x="375" y="100" width="220" height="90" rx="10" fill="#dcedfa" stroke="#315c7c" stroke-width="2"/><text x="485.0" y="152.0" font-size="20" fill="#12314c" text-anchor="middle">Controlador DMA</text><rect x="720" y="100" width="180" height="90" rx="10" fill="#dcedfa" stroke="#315c7c" stroke-width="2"/><text x="810.0" y="152.0" font-size="20" fill="#12314c" text-anchor="middle">Memoria</text><path d="M240 145 L375 145" stroke="#2d729e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="305" y="100" font-size="18" fill="#12314c" text-anchor="middle">configura</text><path d="M595 145 L720 145" stroke="#2d729e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="660" y="100" font-size="18" fill="#12314c" text-anchor="middle">bloque</text><rect x="375" y="270" width="220" height="70" rx="10" fill="#dcedfa" stroke="#315c7c" stroke-width="2"/><text x="485.0" y="312.0" font-size="20" fill="#12314c" text-anchor="middle">Dispositivo</text><path d="M485 265 L485 195" stroke="#2d729e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="190" y="300" font-size="19" fill="#12314c" text-anchor="middle">La CPU no copia cada byte.</text><text x="770" y="300" font-size="19" fill="#12314c" text-anchor="middle">Sí hay arbitraje y costos.</text><text x="480" y="375" font-size="19" fill="#12314c" text-anchor="middle">Al finalizar, una notificación permite completar la operación.</text></g></svg>