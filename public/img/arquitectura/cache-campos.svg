<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title"><title id="title">Partición de dirección para una caché por conjuntos</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#2d729e"/></marker></defs><rect width="960" height="390" rx="16" fill="#f4f8fc"/><g font-family="Arial, sans-serif"><text x="480" y="40" font-size="25" fill="#12314c" text-anchor="middle">Partición de dirección para una caché por conjuntos</text><rect x="70" y="105" width="520" height="90" rx="10" fill="#dcedfa" stroke="#315c7c" stroke-width="2"/><text x="330.0" y="157.0" font-size="20" fill="#12314c" text-anchor="middle">Etiqueta: 9 bits</text><rect x="590" y="105" width="150" height="90" rx="10" fill="#dcedfa" stroke="#315c7c" stroke-width="2"/><text x="665.0" y="157.0" font-size="20" fill="#12314c" text-anchor="middle">Índice: 3</text><rect x="740" y="105" width="150" height="90" rx="10" fill="#dcedfa" stroke="#315c7c" stroke-width="2"/><text x="815.0" y="157.0" font-size="20" fill="#12314c" text-anchor="middle">Offset: 4</text><text x="480" y="245" font-size="21" fill="#12314c" text-anchor="middle">Dirección de 16 bits · C = 256 B · B = 16 B · A = 2 vías</text><text x="480" y="290" font-size="20" fill="#12314c" text-anchor="middle">8 conjuntos; cada conjunto puede contener 2 etiquetas válidas.</text><text x="480" y="335" font-size="22" fill="#12314c" text-anchor="middle">1234h → etiqueta 24h · conjunto 3 · desplazamiento 4</text></g></svg>