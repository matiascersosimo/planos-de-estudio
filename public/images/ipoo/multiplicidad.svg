<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">Leer las cantidades desde el otro extremo</title><desc id="desc">Asociación: Libro uno junto a su extremo y Prestamo cero a muchos junto al suyo.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#a74c33"/></marker><marker id="retorno" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#a74c33"/></marker></defs><rect width="760" height="390" fill="#d9dbd1"/><g font-family="Arial,sans-serif" fill="#292c27"><text x="24" y="40" font-size="24" font-weight="700">Leer las cantidades desde el otro extremo</text><rect x="55" y="155" width="220" height="85" fill="#eeeee4" stroke="#5e635a"/><text x="69" y="185" font-size="18">Libro</text><rect x="485" y="155" width="220" height="85" fill="#eeeee4" stroke="#5e635a"/><text x="499" y="185" font-size="18">Prestamo</text><path d="M275 195H485" stroke="#5e635a" stroke-width="2"/><text x="290" y="182" font-size="18">1</text><text x="423" y="182" font-size="18">0..*</text><text x="35" y="305" font-size="18">Cada préstamo tiene un libro.</text><text x="35" y="345" font-size="17">Un libro puede relacionarse con cero o muchos préstamos históricos.</text></g></svg>