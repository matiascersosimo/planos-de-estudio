<svg xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title desc"><title id="title">Dos referencias, una instancia</title><desc id="desc">Dos variables identifican un único objeto Deposito; la figura es un esquema de referencias.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#a74c33"/></marker><marker id="retorno" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#a74c33"/></marker></defs><rect width="760" height="395" fill="#d9dbd1"/><g font-family="Arial,sans-serif" fill="#292c27"><text x="24" y="40" font-size="24" font-weight="700">Dos referencias, una instancia</text><rect x="60" y="100" width="180" height="55" fill="#eeeee4" stroke="#5e635a"/><text x="74" y="130" font-size="18">a: referencia</text><rect x="60" y="235" width="180" height="55" fill="#eeeee4" stroke="#5e635a"/><text x="74" y="265" font-size="18">b: referencia</text><rect x="460" y="150" width="240" height="110" fill="#eeeee4" stroke="#5e635a"/><text x="474" y="180" font-size="18">d1:Deposito</text><text x="480" y="220" font-size="18">cantidad = 5</text><path d="M240 130L460 180" stroke="#a74c33" stroke-width="2" fill="none" marker-end="url(#flecha)"/><path d="M240 265L460 230" stroke="#a74c33" stroke-width="2" fill="none" marker-end="url(#flecha)"/><text x="30" y="355" font-size="18">a y b permiten llegar al mismo objeto; no son dos depósitos.</text></g></svg>