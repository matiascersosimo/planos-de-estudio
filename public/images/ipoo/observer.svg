<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Notificar mediante un protocolo</title><desc id="desc">Esquema de colaboración: un sensor avisa a dos observadores registrados.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#a74c33"/></marker><marker id="retorno" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#a74c33"/></marker></defs><rect width="760" height="420" fill="#d9dbd1"/><g font-family="Arial,sans-serif" fill="#292c27"><text x="24" y="40" font-size="24" font-weight="700">Notificar mediante un protocolo</text><rect x="50" y="155" width="210" height="75" fill="#eeeee4" stroke="#5e635a"/><text x="64" y="185" font-size="18">Sensor</text><rect x="490" y="95" width="210" height="60" fill="#eeeee4" stroke="#5e635a"/><text x="504" y="125" font-size="18">Observador A</text><rect x="490" y="255" width="210" height="60" fill="#eeeee4" stroke="#5e635a"/><text x="504" y="285" font-size="18">Observador B</text><path d="M260 175L490 125" stroke="#a74c33" stroke-width="2" fill="none" marker-end="url(#flecha)"/><path d="M260 210L490 285" stroke="#a74c33" stroke-width="2" fill="none" marker-end="url(#flecha)"/><text x="290" y="110" font-size="16">actualizar(valor)</text><text x="290" y="305" font-size="16">actualizar(valor)</text><text x="30" y="380" font-size="17">El sujeto conoce el protocolo y conserva el registro de interesados.</text></g></svg>