<svg xmlns="http://www.w3.org/2000/svg" width="760" height="385" viewBox="0 0 760 385" role="img" aria-labelledby="title desc"><title id="title">El pedido conserva identidad y cambia estado</title><desc id="desc">Esquema de transiciones válidas de Pedido: pendiente a pagado, pagado a enviado.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#a74c33"/></marker><marker id="retorno" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#a74c33"/></marker></defs><rect width="760" height="385" fill="#d9dbd1"/><g font-family="Arial,sans-serif" fill="#292c27"><text x="24" y="40" font-size="24" font-weight="700">El pedido conserva identidad y cambia estado</text><rect x="35" y="150" width="190" height="75" fill="#eeeee4" stroke="#5e635a"/><text x="49" y="180" font-size="18">Pendiente</text><rect x="285" y="150" width="190" height="75" fill="#eeeee4" stroke="#5e635a"/><text x="299" y="180" font-size="18">Pagado</text><rect x="535" y="150" width="190" height="75" fill="#eeeee4" stroke="#5e635a"/><text x="549" y="180" font-size="18">Enviado</text><path d="M225 187L285 187" stroke="#a74c33" stroke-width="2" fill="none" marker-end="url(#flecha)"/><path d="M475 187L535 187" stroke="#a74c33" stroke-width="2" fill="none" marker-end="url(#flecha)"/><text x="222" y="135" font-size="16">pagar</text><text x="475" y="135" font-size="16">enviar</text><text x="35" y="300" font-size="18">Enviar antes de pagar: rechazo, sin transición.</text><text x="35" y="340" font-size="18">Pagar otra vez o enviar desde enviado: rechazo en este contrato.</text></g></svg>