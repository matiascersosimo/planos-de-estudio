<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Una clase y su protocolo</title><desc id="desc">Diagrama parcial de clase Deposito con atributos privados y operaciones públicas.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#a74c33"/></marker><marker id="retorno" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#a74c33"/></marker></defs><rect width="760" height="400" fill="#d9dbd1"/><g font-family="Arial,sans-serif" fill="#292c27"><text x="24" y="40" font-size="24" font-weight="700">Una clase y su protocolo</text><rect x="130" y="80" width="500" height="230" fill="#eeeee4" stroke="#5e635a"/><text x="144" y="110" font-size="18">Deposito</text><path d="M130 125H630M130 205H630" stroke="#5e635a"/><text x="150" y="158" font-size="18">- capacidad: int</text><text x="150" y="187" font-size="18">- cantidad: int</text><text x="150" y="238" font-size="18">+ cargar(unidades: int): boolean</text><text x="150" y="274" font-size="18">+ getCantidad(): int</text><text x="35" y="365" font-size="18">Estado privado y operaciones públicas. No se muestran todos los miembros.</text></g></svg>