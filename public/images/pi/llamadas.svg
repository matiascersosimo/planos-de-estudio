<svg xmlns="http://www.w3.org/2000/svg" width="760" height="455" viewBox="0 0 760 455" role="img" aria-labelledby="title desc"><title id="title">Cada activación conserva su espera</title><desc id="desc">Descenso de sumaRec tres hasta su caso base y valores de retorno.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#a74c33"/></marker></defs><rect width="760" height="455" fill="#d9dbd1"/><g font-family="Arial,sans-serif" fill="#292c27"><text x="24" y="40" font-size="24" font-weight="700">Cada activación conserva su espera</text><rect x="35" y="75" width="675" height="55" fill="#eeeee4" stroke="#65695f"/><text x="50" y="108" font-size="18">sumaRec(3): espera 3 + resultado de 2</text><rect x="55" y="150" width="655" height="55" fill="#eeeee4" stroke="#65695f"/><text x="70" y="183" font-size="18">sumaRec(2): espera 2 + resultado de 1</text><rect x="75" y="225" width="635" height="55" fill="#eeeee4" stroke="#65695f"/><text x="90" y="258" font-size="18">sumaRec(1): espera 1 + resultado de 0</text><rect x="95" y="300" width="615" height="55" fill="#eeeee4" stroke="#65695f"/><text x="110" y="333" font-size="18">sumaRec(0): devuelve 0</text><text x="35" y="420" font-size="18">Al retornar se completan las sumas pendientes: 1, luego 3, luego 6.</text></g></svg>