<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Dos punteros, un objeto</title><desc id="desc">P y Q son variables diferentes que apuntan al mismo objeto A.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#a74c33"/></marker></defs><rect width="760" height="430" fill="#d9dbd1"/><g font-family="Arial,sans-serif" fill="#292c27"><text x="24" y="40" font-size="24" font-weight="700">Dos punteros, un objeto</text><rect x="65" y="100" width="180" height="60" fill="#eeeee4" stroke="#65695f"/><text x="80" y="136" font-size="18">p: dirección A</text><rect x="65" y="240" width="180" height="60" fill="#eeeee4" stroke="#65695f"/><text x="80" y="276" font-size="18">q: dirección A</text><rect x="470" y="170" width="225" height="80" fill="#eeeee4" stroke="#65695f"/><text x="485" y="216" font-size="18">Objeto A: entero 7</text><path d="M245 130L470 195" fill="none" stroke="#a74c33" stroke-width="2" marker-end="url(#flecha)"/><path d="M245 270L470 225" fill="none" stroke="#a74c33" stroke-width="2" marker-end="url(#flecha)"/><text x="35" y="355" font-size="18">q = p copia la dirección. *q = 12 cambia el único entero apuntado.</text><text x="35" y="390" font-size="17">Cambiar q a nullptr no cambia el objeto ni el contenido de p.</text></g></svg>