<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">Una capacidad, dos límites</title><desc id="desc">Seis posiciones físicas y cuatro elementos lógicamente válidos.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#a74c33"/></marker></defs><rect width="760" height="350" fill="#d9dbd1"/><g font-family="Arial,sans-serif" fill="#292c27"><text x="24" y="40" font-size="24" font-weight="700">Una capacidad, dos límites</text><rect x="28" y="110" width="106" height="70" fill="#eeeee4" stroke="#65695f"/><text x="43" y="151" font-size="18">4</text><text x="68" y="100" font-size="16">0</text><rect x="144" y="110" width="106" height="70" fill="#eeeee4" stroke="#65695f"/><text x="159" y="151" font-size="18">7</text><text x="184" y="100" font-size="16">1</text><rect x="260" y="110" width="106" height="70" fill="#eeeee4" stroke="#65695f"/><text x="275" y="151" font-size="18">9</text><text x="300" y="100" font-size="16">2</text><rect x="376" y="110" width="106" height="70" fill="#eeeee4" stroke="#65695f"/><text x="391" y="151" font-size="18">2</text><text x="416" y="100" font-size="16">3</text><rect x="492" y="110" width="106" height="70" fill="#b8bbae" stroke="#65695f"/><text x="507" y="151" font-size="18">—</text><text x="532" y="100" font-size="16">4</text><rect x="608" y="110" width="106" height="70" fill="#b8bbae" stroke="#65695f"/><text x="623" y="151" font-size="18">—</text><text x="648" y="100" font-size="16">5</text><text x="28" y="230" font-size="18">Capacidad = 6 posiciones. Dimensión lógica n = 4.</text><text x="28" y="270" font-size="18">Datos válidos: índices 0, 1, 2 y 3.</text><text x="28" y="310" font-size="18">Las posiciones 4 y 5 no pertenecen al conjunto lógico.</text></g></svg>