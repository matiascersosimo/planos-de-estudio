<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc"><title id="title">Una lista circular representada por último</title><desc id="desc">El último nodo enlaza con el primero; no hay un siguiente nulo.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#a74c33"/></marker></defs><rect width="760" height="410" fill="#d9dbd1"/><g font-family="Arial,sans-serif" fill="#292c27"><text x="24" y="40" font-size="24" font-weight="700">Una lista circular representada por último</text><rect x="80" y="160" width="145" height="65" fill="#eeeee4" stroke="#65695f"/><text x="95" y="198" font-size="18">A: 3</text><rect x="310" y="160" width="145" height="65" fill="#eeeee4" stroke="#65695f"/><text x="325" y="198" font-size="18">B: 8</text><rect x="540" y="160" width="145" height="65" fill="#eeeee4" stroke="#65695f"/><text x="555" y="198" font-size="18">C: 14</text><path d="M225 192L310 192" fill="none" stroke="#a74c33" stroke-width="2" marker-end="url(#flecha)"/><path d="M455 192L540 192" fill="none" stroke="#a74c33" stroke-width="2" marker-end="url(#flecha)"/><path d="M615 225V300H150V225" fill="none" stroke="#a74c33" stroke-width="2" marker-end="url(#flecha)"/><text x="500" y="85" font-size="18">ultimo apunta a C</text><path d="M610 100L610 155" fill="none" stroke="#a74c33" stroke-width="2" marker-end="url(#flecha)"/><text x="40" y="365" font-size="18">primero = ultimo-&gt;siguiente. Volver a A completa una vuelta.</text></g></svg>