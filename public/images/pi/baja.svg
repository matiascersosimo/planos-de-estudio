<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">Desenlazar y después liberar</title><desc id="desc">El nodo central se retira del recorrido antes de liberar su memoria.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#a74c33"/></marker></defs><rect width="760" height="450" fill="#d9dbd1"/><g font-family="Arial,sans-serif" fill="#292c27"><text x="24" y="40" font-size="24" font-weight="700">Desenlazar y después liberar</text><text x="24" y="95" font-size="18">Antes:</text><rect x="160" y="65" width="130" height="60" fill="#eeeee4" stroke="#65695f"/><text x="175" y="101" font-size="18">3</text><rect x="370" y="65" width="130" height="60" fill="#eeeee4" stroke="#65695f"/><text x="385" y="101" font-size="18">6</text><rect x="580" y="65" width="130" height="60" fill="#eeeee4" stroke="#65695f"/><text x="595" y="101" font-size="18">9</text><path d="M290 95L370 95" fill="none" stroke="#a74c33" stroke-width="2" marker-end="url(#flecha)"/><path d="M500 95L580 95" fill="none" stroke="#a74c33" stroke-width="2" marker-end="url(#flecha)"/><text x="24" y="245" font-size="18">Después:</text><rect x="160" y="215" width="130" height="60" fill="#eeeee4" stroke="#65695f"/><text x="175" y="251" font-size="18">3</text><rect x="580" y="215" width="130" height="60" fill="#eeeee4" stroke="#65695f"/><text x="595" y="251" font-size="18">9</text><path d="M290 245L580 245" fill="none" stroke="#a74c33" stroke-width="2" marker-end="url(#flecha)"/><text x="110" y="340" font-size="18">1. El siguiente de 3 pasa a apuntar a 9.</text><text x="110" y="375" font-size="18">2. Se libera el nodo que contenía 6.</text><text x="110" y="410" font-size="17">3. No se vuelve a leer la víctima.</text></g></svg>