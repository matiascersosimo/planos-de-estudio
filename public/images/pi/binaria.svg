<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">Conservar candidatos ante igualdad</title><desc id="desc">Traza de búsqueda de la primera aparición del valor cuatro.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#a74c33"/></marker></defs><rect width="760" height="480" fill="#d9dbd1"/><g font-family="Arial,sans-serif" fill="#292c27"><text x="24" y="40" font-size="24" font-weight="700">Conservar candidatos ante igualdad</text><rect x="24" y="85" width="712" height="64" fill="#eeeee4" stroke="#65695f"/><text x="39" y="123" font-size="18"></text><text x="40" y="110" font-size="17">Inicio</text><text x="240" y="110" font-size="18">[0,5)</text><text x="240" y="134" font-size="16">medio 2: valor 4 → derecha 2</text><rect x="24" y="165" width="712" height="64" fill="#eeeee4" stroke="#65695f"/><text x="39" y="203" font-size="18"></text><text x="40" y="190" font-size="17">Segunda decisión</text><text x="240" y="190" font-size="18">[0,2)</text><text x="240" y="214" font-size="16">medio 1: valor 4 → derecha 1</text><rect x="24" y="245" width="712" height="64" fill="#eeeee4" stroke="#65695f"/><text x="39" y="283" font-size="18"></text><text x="40" y="270" font-size="17">Tercera decisión</text><text x="240" y="270" font-size="18">[0,1)</text><text x="240" y="294" font-size="16">medio 0: valor 1 → izquierda 1</text><rect x="24" y="325" width="712" height="64" fill="#eeeee4" stroke="#65695f"/><text x="39" y="363" font-size="18"></text><text x="40" y="350" font-size="17">Cierre</text><text x="240" y="350" font-size="18">[1,1)</text><text x="240" y="374" font-size="16">Verificar índice 1: primera aparición</text><text x="24" y="445" font-size="16">Arreglo [1,4,4,4,9], objetivo 4. Intervalo semiabierto [izquierda,derecha).</text></g></svg>