<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 485" width="760" height="485" role="img" aria-labelledby="title desc"><title id="title">De un problema a una evaluación</title><desc id="desc">La evaluación puede hacer volver sobre objetivos y decisiones; no es un camino irreversible.</desc><rect width="760" height="485" fill="#d9dbd1"/><g font-family="Arial,sans-serif" fill="#292c27"><text x="24" y="43" font-size="24" font-weight="700">De un problema a una evaluación</text><rect x="24" y="80" width="712" height="70" fill="#eeeee4" stroke="#64675f"/><text x="44" y="105" font-size="19" font-weight="700">Diagnóstico compartido</text><text x="44" y="131" font-size="16">Actores, necesidades y condiciones del problema.</text><path d="M380 151v17m-5-5 5 5 5-5" fill="none" stroke="#b05c41" stroke-width="2"/><rect x="24" y="170" width="712" height="70" fill="#eeeee4" stroke="#64675f"/><text x="44" y="195" font-size="19" font-weight="700">Acuerdos y objetivos</text><text x="44" y="221" font-size="16">Qué cambio se busca y qué responsabilidades se asumen.</text><path d="M380 241v17m-5-5 5 5 5-5" fill="none" stroke="#b05c41" stroke-width="2"/><rect x="24" y="260" width="712" height="70" fill="#eeeee4" stroke="#64675f"/><text x="44" y="285" font-size="19" font-weight="700">Actividades y productos</text><text x="44" y="311" font-size="16">Qué se hace y qué se entrega o registra.</text><path d="M380 331v17m-5-5 5 5 5-5" fill="none" stroke="#b05c41" stroke-width="2"/><rect x="24" y="350" width="712" height="70" fill="#eeeee4" stroke="#64675f"/><text x="44" y="375" font-size="19" font-weight="700">Resultados y reflexión</text><text x="44" y="401" font-size="16">Qué cambió, cómo se sabe y qué debe revisarse.</text></g></svg>