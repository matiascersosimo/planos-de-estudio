<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 485" width="760" height="485" role="img" aria-labelledby="title desc"><title id="title">Dimensiones de la internacionalización</title><desc id="desc">Dimensiones que se articulan; no son etapas ni un ranking de importancia.</desc><rect width="760" height="485" fill="#d9dbd1"/><g font-family="Arial,sans-serif" fill="#292c27"><text x="24" y="43" font-size="24" font-weight="700">Dimensiones de la internacionalización</text><rect x="24" y="80" width="712" height="70" fill="#eeeee4" stroke="#64675f"/><text x="44" y="105" font-size="19" font-weight="700">Formación</text><text x="44" y="131" font-size="16">Currículo, perspectivas comparadas y aprendizajes.</text><rect x="24" y="170" width="712" height="70" fill="#eeeee4" stroke="#64675f"/><text x="44" y="195" font-size="19" font-weight="700">Investigación y cooperación</text><text x="44" y="221" font-size="16">Preguntas, recursos, redes y responsabilidades compartidas.</text><rect x="24" y="260" width="712" height="70" fill="#eeeee4" stroke="#64675f"/><text x="44" y="285" font-size="19" font-weight="700">Movilidad y experiencias en casa</text><text x="44" y="311" font-size="16">Distintas condiciones para acceder a experiencias internacionales.</text><rect x="24" y="350" width="712" height="70" fill="#eeeee4" stroke="#64675f"/><text x="44" y="375" font-size="19" font-weight="700">Gestión y evaluación</text><text x="44" y="401" font-size="16">Acuerdos, equidad, reciprocidad y resultados documentados.</text></g></svg>