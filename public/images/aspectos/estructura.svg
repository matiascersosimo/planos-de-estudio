<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 395" width="760" height="395" role="img" aria-labelledby="title desc"><title id="title">Leer una estructura académica</title><desc id="desc">Funciones relacionadas: la disposición visual no representa jerarquía ni subordinación.</desc><rect width="760" height="395" fill="#d9dbd1"/><g font-family="Arial,sans-serif" fill="#292c27"><text x="24" y="43" font-size="24" font-weight="700">Leer una estructura académica</text><rect x="24" y="80" width="712" height="70" fill="#eeeee4" stroke="#64675f"/><text x="44" y="105" font-size="19" font-weight="700">Escuelas</text><text x="44" y="131" font-size="16">Carreras y formación dentro de la organización institucional.</text><rect x="24" y="170" width="712" height="70" fill="#eeeee4" stroke="#64675f"/><text x="44" y="195" font-size="19" font-weight="700">Departamentos</text><text x="44" y="221" font-size="16">Articulación de capacidades y actividades disciplinares.</text><rect x="24" y="260" width="712" height="70" fill="#eeeee4" stroke="#64675f"/><text x="44" y="285" font-size="19" font-weight="700">Institutos</text><text x="44" y="311" font-size="16">Organización de capacidades de investigación.</text></g></svg>