<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 485" width="760" height="485" role="img" aria-labelledby="title desc"><title id="title">Una historia de transformaciones</title><desc id="desc">Recorrido orientativo; las etapas tienen diferencias y continuidades.</desc><rect width="760" height="485" fill="#d9dbd1"/><g font-family="Arial,sans-serif" fill="#292c27"><text x="24" y="43" font-size="24" font-weight="700">Una historia de transformaciones</text><rect x="24" y="80" width="712" height="70" fill="#eeeee4" stroke="#64675f"/><text x="44" y="105" font-size="19" font-weight="700">Siglos XII–XIII</text><text x="44" y="131" font-size="16">Formación de corporaciones universitarias europeas.</text><path d="M380 151v17m-5-5 5 5 5-5" fill="none" stroke="#b05c41" stroke-width="2"/><rect x="24" y="170" width="712" height="70" fill="#eeeee4" stroke="#64675f"/><text x="44" y="195" font-size="19" font-weight="700">Siglo XIX</text><text x="44" y="221" font-size="16">Estados nacionales, profesiones y modelos universitarios.</text><path d="M380 241v17m-5-5 5 5 5-5" fill="none" stroke="#b05c41" stroke-width="2"/><rect x="24" y="260" width="712" height="70" fill="#eeeee4" stroke="#64675f"/><text x="44" y="285" font-size="19" font-weight="700">1918</text><text x="44" y="311" font-size="16">Reforma: disputas por participación y renovación.</text><path d="M380 331v17m-5-5 5 5 5-5" fill="none" stroke="#b05c41" stroke-width="2"/><rect x="24" y="350" width="712" height="70" fill="#eeeee4" stroke="#64675f"/><text x="44" y="375" font-size="19" font-weight="700">Siglo XX</text><text x="44" y="401" font-size="16">Masificación, ciencia, restricciones y recuperación democrática.</text></g></svg>